    Aggregations:
      type: string
      enum:
      - minute
      - hour
      - day
      - week
      - month
      - quarter
      - year
      title: Aggregations
    CaseDetails:
      properties:
        overall_risk_score:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Overall Risk Score
          description: Aggregate risk score across all fraud signals, on a 1-5 scale
            (1=lowest risk, 5=highest risk)
          examples:
          - 3
          readOnly: true
        fraud_labels:
          items:
            $ref: '#/components/schemas/FraudLabels'
          type: array
          minItems: 1
          title: Fraud Labels
          description: All fraud categories detected for this case; must contain at
            least the `primary_fraud_label`
          examples:
          - - Account Takeover
            - Bot
          readOnly: true
        primary_fraud_label:
          $ref: '#/components/schemas/FraudLabels'
          minLength: 1
          description: Most significant fraud category for this case; always present
            in `fraud_labels`
          examples:
          - Account Takeover
          readOnly: true
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
          description: Natural-language summary of the detected fraud signals; null
            when no summary is available
          examples:
          - Account takeover attempt detected from suspicious IP
          readOnly: true
        highlights:
          items:
            type: string
          type: array
          title: Highlights
          description: Short bullet points highlighting the strongest fraud signals
            contributing to the score
          examples:
          - - Multiple failed login attempts
            - IP from high-risk country
          readOnly: true
        recommended_action:
          anyOf:
          - $ref: '#/components/schemas/RecommendedAction'
          - type: 'null'
          description: 'Suggested response action: MONITOR, CHALLENGE, BLOCK, or ESCALATE'
          default: BLOCK
          examples:
          - BLOCK
          readOnly: true
      type: object
      required:
      - overall_risk_score
      - fraud_labels
      - primary_fraud_label
      - summary
      title: CaseDetails
    CaseListItemResponse:
      properties:
        case_id:
          type: string
          title: Case Id
          description: Unique case identifier used in `/cases/{case_id}` paths
          examples:
          - case-abc123
          readOnly: true
        website_account_id:
          type: string
          title: Website Account Id
          description: Identifier of the end user's website account; defaults to `UNKNOWN`
            when the account cannot be resolved
          default: UNKNOWN
          examples:
          - account-abc123
          readOnly: true
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Time the case was opened (RFC 3339 / ISO 8601 UTC)
          examples:
          - '2024-01-15T10:30:00Z'
          readOnly: true
        status:
          $ref: '#/components/schemas/CaseStatus'
          description: Current lifecycle status of the case (OPEN or CLOSED)
          examples:
          - OPEN
          readOnly: true
        overall_risk_score:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Overall Risk Score
          description: Aggregate risk score across all fraud signals, on a 1-5 scale
            (1=lowest risk, 5=highest risk)
          examples:
          - 3
          readOnly: true
      type: object
      required:
      - case_id
      - created_at
      - status
      - overall_risk_score
      title: CaseListItemResponse
