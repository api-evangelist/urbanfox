            on subsequent API requests'
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
          readOnly: true
        token_type:
          type: string
          const: Bearer
          title: Token Type
          description: OAuth 2.0 token type; always `Bearer` for this API
          examples:
          - Bearer
          readOnly: true
        expires_in:
          type: integer
          exclusiveMinimum: 0.0
          title: Expires In
          description: Number of seconds until the access token expires, counted from
            issuance
          examples:
          - 86400
          readOnly: true
      additionalProperties: false
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      title: OAuthTokenResponse
    ProblemDetail:
      properties:
        type:
          type: string
          title: Type
          description: URI reference (or identifier) for problem type
          default: about:blank
          examples:
          - validation-error
          readOnly: true
        title:
          type: string
          title: Title
          description: Short, human-readable summary
          examples:
          - Validation Failed
          readOnly: true
        status:
          type: integer
          maximum: 599.0
          minimum: 100.0
          title: Status
          description: HTTP status code
          examples:
          - 400
          readOnly: true
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Human-readable explanation (MUST NOT contain PII or sensitive
            data)
          examples:
          - Request validation failed on one or more fields
          readOnly: true
        instance:
          anyOf:
          - type: string
          - type: 'null'
          title: Instance
          description: URI reference identifying this specific occurrence (e.g., request
            ID)
          examples:
          - /v2/demo-retail/cases/case-abc123
          readOnly: true
        errors:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Errors
          description: Validation errors (extension member)
          examples:
          - - field: status
              message: Input should be 'OPEN' or 'CLOSED'
              type: enum
          readOnly: true
      type: object
      required:
      - title
      - status
      title: ProblemDetail
    RecommendedAction:
      type: string
      enum:
      - MONITOR
      - CHALLENGE
      - BLOCK
      - ESCALATE
      title: RecommendedAction
    SessionStatus:
      type: string
      enum:
      - ACTIVE
      - FINISHED
      title: SessionStatus
    ShapContributor:
      properties:
        feature:
          type: string
          minLength: 1
          title: Feature
          description: Machine-readable feature name used by the model
          examples:
          - total_event_count
          readOnly: true
        plain_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Plain Name
          description: Human-readable feature label for UI display
          examples:
          - Total Event Count
          readOnly: true
        feature_value:
          anyOf:
          - type: number
          - type: integer
          - type: string
          - type: boolean
          - type: 'null'
          title: Feature Value
          description: Observed value of this feature for the scored session; null
            when unavailable
          examples:
          - 30
          readOnly: true
        shap_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Shap Value
          description: Raw signed SHAP value (positive = toward fraud, negative =
            toward safe)
          examples:
          - 1.151
          readOnly: true
        direction:
          anyOf:
          - type: string
          - type: 'null'
          title: Direction
          description: Whether this feature pushed the prediction toward fraud or
            away from it
          examples:
          - toward_fraud
          readOnly: true
        alignment:
          anyOf:
          - type: string
          - type: 'null'
          title: Alignment
          description: Whether this feature supports or contradicts the model's prediction
          examples:
          - supporting
          readOnly: true
        impact_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Impact Level
          description: Importance bucket assigned to this feature
          examples:
          - critical
          readOnly: true
        direction_specific:
          anyOf:
          - type: string
          - type: 'null'
          title: Direction Specific
          description: Model-specific probability movement caused by this feature
          examples:
          - increases_BotActor_probability
          readOnly: true
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Plain-language explanation of what the feature measures
          examples:
          - Total number of events in the session
          readOnly: true
      type: object
      required:
      - feature
      title: ShapContributor
    SnippetItem:
      properties:
        framework:
          type: string
          enum:
          - HTML
          - PlaceHolder
          title: Framework
          description: Target platform for the snippet. `HTML` is the browser script
            tag; `PlaceHolder` is reserved for future native SDK targets.
          examples:
          - HTML
          readOnly: true
        snippet:
          type: string
          minLength: 1
          title: Snippet
          description: Drop-in integration snippet pre-configured with the tenant's
            `app_id` and collector endpoint
          examples:
          - "<script src=\"https://cdn.example.com/clickstream-web.min.js\"></script>\n\
            <script>\n    window.ClickstreamAnalytics.init({\n        appId: \"demo-retail_00000000000000000000000000000001\"\
            ,\n        endpoint: \"https://collector.example.com\",\n        globalAttributes:\
            \ {\n          tenant_id: \"00000000-0000-4000-8000-000000000000\"\n \
            \       }\n    })\n</script>"
          readOnly: true
      additionalProperties: false
      type: object
      required:
      - framework
      - snippet
      title: SnippetItem
    SnippetResponse:
      properties:
        snippets:
          items:
            $ref: '#/components/schemas/SnippetItem'
          type: array
          minItems: 1
          title: Snippets
          description: Integration snippets, one per supported target platform
          examples:
          - - framework: HTML
              snippet: "<script src=\"https://cdn.example.com/clickstream-web.min.js\"\
                ></script>\n<script>\n    window.ClickstreamAnalytics.init({\n   \
                \     appId: \"demo-retail_00000000000000000000000000000001\",\n \
                \       endpoint: \"https://collector.example.com\",\n        globalAttributes:\
                \ {\n          tenant_id: \"00000000-0000-4000-8000-000000000000\"\
                \n        }\n    })\n</script>"
          readOnly: true
        tenant_name:
          type: string
          minLength: 1
          title: Tenant Name
          description: Tenant slug returned as tenant_name for compatibility
          examples:
          - demo-retail
          readOnly: true
        app_id:
          type: string
          minLength: 1
          title: App Id
          description: 'Clickstream application identifier embedded in the snippet
            (format: `<tenant_slug>_<32-char-hex>`)'
          examples:
          - demo-retail_00000000000000000000000000000001
          readOnly: true
        tenant_id:
          type: string
          minLength: 1
          format: uuid
          title: Tenant Id
          description: Tenant identifier sent as `globalAttributes.tenant_id` on every
            clickstream event
          examples:
          - 00000000-0000-4000-8000-000000000000
          readOnly: true
      additionalProperties: false
      type: object
      required:
      - snippets
      - tenant_name
      - app_id
      - tenant_id
      title: SnippetResponse
    TenantAuthSecretResponse:
      properties:
        client_id:
          type: string
          title: Client Id
          description: OAuth 2.0 client identifier. Send this value as `client_id`
            when requesting a token from `POST /v2/oauth/token`.
          examples:
          - A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6
          readOnly: true
        client_secret:
          type: string
          title: Client Secret
          description: Current OAuth 2.0 client secret; send as `client_secret` (with
            `client_id`) when requesting a token from `POST /v2/oauth/token`
          examples:
          - csec_example_7q9x2k4m6p8r0t1v3w5y
          readOnly: true
      additionalProperties: false
      type: object
      required:
      - client_id
      - client_secret
      title: TenantAuthSecretResponse
    TenantDetailsResponse:
      properties:
        tenant_name:
          type: string
          title: Tenant Name
          description: Unique tenant slug returned as tenant_name for compatibility
            (e.g. `/v2/{tenant_slug}/...`)
          examples:
          - demo-retail
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
          description: Stable UUID identifier for the tenant, embedded in JWT claims
            and downstream services
          examples:
          - 00000000-0000-4000-8000-000000000000
          readOnly: true
        client_id:
          type: string
          title: Client Id
          description: OAuth 2.0 client identifier. Send this value as `client_id`
            when requesting a token from `POST /v2/oauth/token`.
          examples:
          - A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6
          readOnly: true
        clickstream_app_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Clickstream App Id
          description: 'Clickstream application identifier injected into the tracking
            snippet (format: `<tenant_slug>_<32-char-hex>`); null until provisioned'
          examples:
          - demo-retail_00000000000000000000000000000001
          readOnly: true
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: Time the tenant record was created (RFC 3339 / ISO 8601 UTC);
            null for tenants created before this field was tracked
          examples:
          - '2026-03-10T14:32:00Z'
          readOnly: true
      additionalProperties: false
      type: object
      required:
      - tenant_name
      - tenant_id
      - client_id
      title: TenantDetailsResponse
    TenantRotateAuthSecretResponse:
      properties:
        client_id:
          type: string
          title: Client Id
          description: OAuth 2.0 client identifier. Send this value as `client_id`
            when requesting a token from `POST /v2/oauth/token`.
          examples:
          - A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6
          readOnly: true
        client_secret:
          type: string
          title: Client Secret
          description: Newly issued OAuth 2.0 client secret; the previous secret is
            invalidated immediately
          examples:
          - csec_example_9v1t0r8p6m4k2xq7y5w3
          readOnly: true
      additionalProperties: false
      type: object
      required:
      - client_id
      - client_secret
      title: TenantRotateAuthSecretResponse
    OAuthTokenFormRequest:
      additionalProperties: false
      examples:
      - client_id: A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6
        client_secret: csec_example_7q9x2k4m6p8r0t1v3w5y
        grant_type: client_credentials
      properties:
        grant_type:
          const: client_credentials
          description: OAuth 2.0 grant type; must be `client_credentials`.
          examples:
          - client_credentials
          title: Grant Type
          type: string
        client_id:
          description: OAuth 2.0 client identifier issued for the tenant.
          examples:
          - A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6
          maxLength: 100
          minLength: 1
          title: Client Id
          type: string
        client_secret:
          description: OAuth 2.0 client secret paired with `client_id`.
          examples:
          - csec_example_7q9x2k4m6p8r0t1v3w5y
          maxLength: 200
          minLength: 1
          title: Client Secret
          type: string
      required:
      - grant_type
      - client_id
      - client_secret
      title: OAuthTokenFormRequestModel
      type: object
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'OAuth 2.0 client-credentials flow. Request a token from `POST
        /v2/oauth/token` and send it as `Authorization: Bearer <access_token>`.'
      flows:
        clientCredentials:
          tokenUrl: https://api.demo-retail.urbanfox.io/v2/oauth/token
          scopes:
            create:enduseraccount: Create an end-user account
            delete:enduseraccount: Delete an end-user account
            read:case: Get a case
            read:cases: List cases
            read:enduseraccount: Get an end-user account
            read:enduseraccounts: List end-user accounts
            read:metrics: Get tenant metrics
            read:snippet: Get integration snippets
            read:tenant: Get tenant
            read:tenant_auth_secret: Get tenant OAuth client credentials
            update:case: Update a case
            update:enduseraccount: Update an end-user account
            update:tenant_auth_secret: Rotate tenant OAuth client secret
tags:
- name: Cases
  description: Fraud case retrieval and updates.
- name: End User Accounts
  description: End-user account retrieval, creation, updates, and deletion.
- name: Metrics
  description: Aggregated tenant metrics and time-series reporting.
- name: OAuth
  description: OAuth token generation for machine-to-machine authentication.
- name: Snippet
  description: Tenant integration snippet retrieval.
- name: Tenants
  description: Tenant details and tenant authentication credentials.
security:
- oauth2: []
