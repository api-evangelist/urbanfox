          examples:
          - case-abc123
          readOnly: true
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
          description: Identifier of the tenant that owns this case
          examples:
          - 00000000-0000-4000-8000-000000000000
          readOnly: true
        website_account_id:
          type: string
          title: Website Account Id
          description: Identifier of the end user's website account; defaults to `UNKNOWN`
            when the account cannot be resolved
          default: UNKNOWN
          examples:
          - account-abc123
          readOnly: true
        session_id:
          type: string
          title: Session Id
          description: Identifier of the user session this case originated from
          examples:
          - a1b2c3d4-20240115-103500000
          readOnly: true
        unique_id:
          type: string
          format: uuid
          title: Unique Id
          description: Opaque record identifier; clients should use `case_id` for
            all references
          examples:
          - 8f1e2d3c-4b5a-6978-8a9b-0c1d2e3f4a5b
          readOnly: true
        end_user_is_blocked:
          type: boolean
          title: End User Is Blocked
          description: True when the end user account associated with this case is
            blocked from accessing services
          examples:
          - false
          readOnly: true
        status:
          $ref: '#/components/schemas/CaseStatus'
          description: Current lifecycle status of the case (OPEN or CLOSED)
          examples:
          - OPEN
          readOnly: true
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Time the case was opened (RFC 3339 / ISO 8601 UTC)
          examples:
          - '2024-01-15T10:30:00Z'
          readOnly: true
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
          description: Time of the most recent case update (RFC 3339 / ISO 8601 UTC);
            null when the case has never been updated
          examples:
          - '2024-01-15T14:20:00Z'
          readOnly: true
        current_state:
          anyOf:
          - $ref: '#/components/schemas/CaseState'
          - type: 'null'
          description: Most recent state snapshot in the case lifecycle
          examples:
          - case_status: OPEN
            changed_at: '2024-01-15T10:35:00Z'
            changed_by: system
            reason: Case created from model prediction
            score: 4
            session_status: ACTIVE
            state_id: 7a54d2a4-5e2f-4b72-9a4a-3276b4af0c11
          readOnly: true
        state_history:
          anyOf:
          - items:
              $ref: '#/components/schemas/CaseState'
            type: array
          - type: 'null'
          title: State History
          description: All prior state snapshots for this case ordered chronologically
            (oldest first)
          examples:
          - - case_status: OPEN
              changed_at: '2024-01-15T10:35:00Z'
              changed_by: system
              reason: Case created from model prediction
              score: 4
              session_status: ACTIVE
              state_id: 7a54d2a4-5e2f-4b72-9a4a-3276b4af0c11
          readOnly: true
        details:
          $ref: '#/components/schemas/CaseDetails'
          description: Fraud analysis output from the risk-scoring model (labels,
            summary, recommended action)
          examples:
          - fraud_labels:
            - Account Takeover
            highlights:
            - Multiple failed login attempts
            - IP from high-risk country
            overall_risk_score: 3
            primary_fraud_label: Account Takeover
            recommended_action: BLOCK
            summary: Account takeover attempt detected from suspicious IP
          readOnly: true
        fraud_occurrences:
          additionalProperties:
            $ref: '#/components/schemas/DetailedFraudOccurrence'
          type: object
          title: Fraud Occurrences
          description: Fraud occurrences for this case, keyed by `occurrence_id`.
            Entries follow the detailed fraud occurrence shape.
          examples:
          - 15e341ed-6dae-4783-8647-32a7b7a8269a:
              explanation:
                fraud_reason: High velocity account creation
                fraud_reason_description: The account was created very fast and may
                  indicate a bot was used.
                fraud_types:
                - Bot Creation
                model_behaviour:
                - model_name: bos_session_aggregate_classifier
                  top_contributors:
                  - alignment: supporting
                    description: Total number of events in the session
                    direction: toward_fraud
                    direction_specific: increases_BotActor_probability
                    feature: total_event_count
                    feature_value: 30
                    impact_level: critical
                    plain_name: Total Event Count
                    shap_value: 1.151
                  type: shap
              generated_at: '2024-01-15T10:35:00Z'
              occurrence_id: 15e341ed-6dae-4783-8647-32a7b7a8269a
              prediction_id: pred_a1b2c3d4-20240115-103500000_2024-01-15T10:35:00Z
              risk_score: 4
              session_id: a1b2c3d4-20240115-103500000
          readOnly: true
      type: object
      required:
      - case_id
      - tenant_id
      - session_id
      - unique_id
      - end_user_is_blocked
      - status
      - created_at
      - details
      title: CaseSingleResponse
    CaseState:
      properties:
