        schema:
          type: string
          maxLength: 100
          minLength: 3
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          title: Tenant Name
          description: Tenant DNS slug (lowercase letters, digits, and hyphens; 3-100
            characters).
          examples:
          - demo-retail
        name: tenant_slug
        in: path
      - description: Unique case identifier returned by `GET /cases`.
        required: true
        schema:
          type: string
          minLength: 1
          title: Case Id
          description: Unique case identifier returned by `GET /cases`.
          examples:
