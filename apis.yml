aid: urbanfox
name: UrbanFox
description: UrbanFox is an AI-powered online payment fraud detection and prevention
  platform that uses generative AI and behavioral intelligence - rather than static
  rule-sets - to detect payment fraud, account takeover, and bot traffic across
  transactions, sessions, and accounts. The Techstars-backed company ships a
  tenant-scoped Customer API (OAuth 2.0 client credentials) for fraud case
  management, end-user account management, activity metrics, credential rotation,
  and clickstream collector integration.
